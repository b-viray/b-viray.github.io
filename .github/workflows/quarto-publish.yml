on:
  workflow_dispatch:
  push:
    branches: [master]
  # Rebuild once a day so the arXiv list on the research page stays current
  # even when nothing has been pushed. 11:00 UTC = 4am PDT / 3am PST.
  schedule:
    - cron: "0 11 * * *"

name: Quarto Publish

# Cancel any in-progress run for the same branch so rapid pushes
# don't pile up — only the latest push gets deployed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required by the Quarto publish action

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Regenerates _arxiv-recent.qmd (the recent-papers list on the research
      # page). If arXiv is unreachable the script leaves the committed file
      # alone and exits 0, so a bad arXiv day never breaks the build.
      - name: Refresh recent arXiv papers
        run: python3 scripts/fetch_arxiv.py

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
